spring.application.name=pdf-rag-agent

# MongoDB Atlas Configuration
spring.data.mongodb.uri=${MONGODB_URI}

# Spring AI Vector Store (MongoDB Atlas)
spring.ai.vectorstore.mongodb.initialize-schema=true
spring.ai.vectorstore.mongodb.collection-name=article_embeddings
spring.ai.vectorstore.mongodb.index-name=vector_index

# Spring AI Ollama Configuration (Local)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.embedding.options.model=nomic-embed-text

spring.shell.interactive.enabled=true
